# xLights Show Reference — Apache Reverse Proxy
# Matches the pattern of portainer.keithmarx.com.conf
#
# In Virtualmin:
#   1. Create Virtual Server: xlights.keithmarx.com
#   2. Let Virtualmin generate SSL cert (fills in the cert ID path)
#   3. Replace the <VirtualHost *:443> directives with the block below
#      OR paste into: Server Configuration → Edit Apache Directives
#
# Then on the server:
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo systemctl restart apache2

<VirtualHost *:80>
    SuexecUserGroup #1009 #1008
    ServerName xlights.keithmarx.com
    DocumentRoot /home/keithmarx/domains/xlights.keithmarx.com/public_html
    ErrorLog  /var/log/virtualmin/xlights.keithmarx.com_error_log
    CustomLog /var/log/virtualmin/xlights.keithmarx.com_access_log combined

    <Directory /home/keithmarx/domains/xlights.keithmarx.com/public_html>
        Require all granted
    </Directory>

    ProxyPass /.well-known !
    RewriteEngine on
    RewriteRule ^/(?!\.well-known)(.*)$ https://xlights.keithmarx.com/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    SuexecUserGroup #1009 #1008
    ServerName xlights.keithmarx.com
    DocumentRoot /home/keithmarx/domains/xlights.keithmarx.com/public_html
    ErrorLog  /var/log/virtualmin/xlights.keithmarx.com_error_log
    CustomLog /var/log/virtualmin/xlights.keithmarx.com_access_log combined

    <Directory /home/keithmarx/domains/xlights.keithmarx.com/public_html>
        Require all granted
    </Directory>

    # SSL — Virtualmin fills in the cert ID when it creates the virtual server
    SSLEngine on
    SSLCertificateFile    /etc/ssl/virtualmin/1779388941364282/ssl.cert
    SSLCertificateKeyFile /etc/ssl/virtualmin/1779388941364282/ssl.key
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCACertificateFile  /etc/ssl/virtualmin/1779388941364282/ssl.ca

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known !
    ProxyPass        / http://127.0.0.1:3030/
    ProxyPassReverse / http://127.0.0.1:3030/

    # Increase upload limit for xlights XML files
    LimitRequestBody 52428800
    ProxyTimeout     120
</VirtualHost>
